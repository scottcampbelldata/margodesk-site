name = "margodesk"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "margo-waitlist"
database_id = "REPLACE_WITH_D1_ID"

# Notification email goes through the margo-waitlist-notify Worker (Pages cannot bind send_email directly).
[[services]]
binding = "NOTIFY"
service = "margo-waitlist-notify"

[vars]
PRODUCT = "margodesk"
